[project]
name = "2ppass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.3",
    "django>=5.2.7",
]

[dependency-groups]
dev = [
    "icecream>=2.1.8",
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
]

[tool.ruff]
target-version = "py313"
line-length = 80
exclude = ["*__init__.py", "migrations/*"]

[tool.ruff.lint]
extend-select = ["UP"]
fixable = ["ALL"]
ignore = ["UP009", "D100", "D206"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 80
indent-style = "tab"

[tool.ruff.lint.isort]
case-sensitive = true
constants = ["__future__"]
detect-same-package = true
known-first-party = ["src"]
lines-after-imports = 2
lines-between-types = 1
order-by-type = true
