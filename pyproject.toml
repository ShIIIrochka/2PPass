[tool.poetry]
name = "2ppass"
version = "0.1.0"
description = ""
authors = ["Ksenia Travnikova <i@ksenia-travnikova.ru>"]
license = "CC BY-NC-SA 4.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
ruff = "^0.9.2"
mypy = "^1.14.1"

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "__init__.py",
    "settings.py",
    "local_settings.py",
    "docs",
    "app_template/*",
    "app/alembic/*",
    ".venv",
    ".vscode",
    "venv",
    "dist",
]
line-length = 80
indent-width = 4
max-complexity = 18

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
