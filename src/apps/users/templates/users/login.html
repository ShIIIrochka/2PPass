{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход - 2PPass</title>
    <link rel="stylesheet" href="{% static 'users/users.css' %}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
        }
        .login-box {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(12, 20, 42, 0.12);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #1b1f2a;
        }
        .login-box p {
            margin: 0 0 24px;
            color: #6b7280;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .login-container {
                padding: 16px;
            }
            .login-box {
                padding: 24px 20px;
            }
            .login-box h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>2PPass</h1>
            <p>Войдите в систему</p>
            <form id="loginForm" class="form">
                {% csrf_token %}
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-row">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <div id="loginMessage" class="form-message hidden"></div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Войти</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{% static 'users/auth.js' %}"></script>
</body>
</html>
