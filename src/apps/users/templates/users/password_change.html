{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Смена пароля - 2PPass</title>
    <link rel="stylesheet" href="{% static 'users/users.css' %}">
    <style>
        .password-change-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
        }
        .password-change-box {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(12, 20, 42, 0.12);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .password-change-box h1 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #1b1f2a;
        }
        .password-change-box p {
            margin: 0 0 24px;
            color: #6b7280;
            font-size: 14px;
        }
        .profile-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #eef1f6;
        }
    </style>
</head>
<body>
    <div class="password-change-container">
        <div class="password-change-box">
            <h1>Смена пароля</h1>
            <p>Для продолжения работы необходимо изменить временный пароль</p>
            <form id="passwordChangeForm" class="form">
                {% csrf_token %}
                <div class="form-row">
                    <label for="old_password">Текущий пароль</label>
                    <input type="password" id="old_password" name="old_password" required autocomplete="current-password">
                </div>
                <div class="form-row">
                    <label for="new_password">Новый пароль</label>
                    <input type="password" id="new_password" name="new_password" required autocomplete="new-password" minlength="8">
                </div>
                <div class="form-row">
                    <label for="new_password_confirm">Подтвердите новый пароль</label>
                    <input type="password" id="new_password_confirm" name="new_password_confirm" required autocomplete="new-password" minlength="8">
                </div>
                <div id="passwordMessage" class="form-message hidden"></div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Изменить пароль</button>
                </div>
            </form>
            <div id="profileSection" class="profile-section hidden">
                <h2 style="font-size: 18px; margin: 0 0 16px;">Профиль (необязательно)</h2>
                <form id="profileForm" class="form">
                    {% csrf_token %}
                    <div class="form-row">
                        <label for="first_name">Имя</label>
                        <input type="text" id="first_name" name="first_name" autocomplete="given-name">
                    </div>
                    <div class="form-row">
                        <label for="last_name">Фамилия</label>
                        <input type="text" id="last_name" name="last_name" autocomplete="family-name">
                    </div>
                    <div class="form-row">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>
                    <div id="profileMessage" class="form-message hidden"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Сохранить профиль</button>
                        <a href="/users/" class="btn" style="margin-left: 8px; text-decoration: none; display: inline-block;">Пропустить</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="{% static 'users/auth.js' %}"></script>
</body>
</html>
